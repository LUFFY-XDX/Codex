<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with CoderX AI</title>
   
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <!-- Messages will appear here -->
        </div>
        <div class="input-container">
            <textarea id="user-message" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #fff;
}

.chat-container {
    width: 400px;
    max-width: 100%;
    height: 600px;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    background: #181818;
    padding: 20px;
    position: relative;
}

.chat-box {
    flex-grow: 1;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 10px;
    background: #222;
}

.chat-box .message {
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    max-width: 70%;
    display: inline-block;
    clear: both;
}

.chat-box .user-message {
    background: #4caf50;
    color: white;
    float: right;
    text-align: right;
}

.chat-box .ai-response {
    background: #2196f3;
    color: white;
    float: left;
    text-align: left;
}

.input-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

textarea {
    width: 80%;
    padding: 10px;
    background: #333;
    border: none;
    border-radius: 10px;
    color: white;
    resize: none;
    outline: none;
    font-size: 14px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
}

button {
    padding: 10px 20px;
    background: #f44336;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s ease;
}

button:hover {
    background: #e53935;
}

/* Neon Glow Effect */
button, .message {
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
}

button:active {
    background: #c62828;
}

/* Media Queries for smaller devices */
@media (max-width: 480px) {
    .chat-container {
        width: 100%;
        height: 100%;
    }

    textarea {
        font-size: 12px;
    }

    button {
        font-size: 12px;
    }
}
</style>
<script>
document.getElementById('send-btn').addEventListener('click', function () {
    let userMessage = document.getElementById('user-message').value.trim();
    if (userMessage) {
        addMessage('user-message', userMessage);
        document.getElementById('user-message').value = '';
        sendMessage(userMessage);
    }
});

function addMessage(type, message) {
    let messageDiv = document.createElement('div');
    messageDiv.classList.add('message', type);
    messageDiv.textContent = message;
    document.getElementById('chat-box').appendChild(messageDiv);
    document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
}

function sendMessage(message) {
    fetch('/chat/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'user_message=' + encodeURIComponent(message)
    })
    .then(response => response.json())
    .then(data => {
        if (data.ai_response) {
            addMessage('ai-response', data.ai_response);
        } else {
            addMessage('ai-response', "Sorry, I couldn't get a response.");
        }
    })
    .catch(error => {
        console.error('Error:', error);
        addMessage('ai-response', "Something went wrong!");
    });
}
</script>
</body>
</html>
