<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoderX AI Neon Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }body {
  font-family: 'Orbitron', sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
  color: #0ff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.chat-container {
  width: 420px;
  height: 600px;
  background: #111;
  border: 2px solid #0ff;
  border-radius: 20px;
  box-shadow: 0 0 25px #0ff, 0 0 40px #0ff inset;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: 20px;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  background: #1a1a1a;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 20px;
  box-shadow: inset 0 0 10px #0ff;
}

.message {
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  max-width: 80%;
  word-wrap: break-word;
}

.user-message {
  background: #0ff;
  color: #000;
  margin-left: auto;
  text-align: right;
  box-shadow: 0 0 15px #0ff;
}

.ai-response {
  background: #222;
  color: #0ff;
  margin-right: auto;
  text-align: left;
  box-shadow: 0 0 10px #0ff inset;
}

.input-container {
  display: flex;
  gap: 10px;
  align-items: center;
}

textarea {
  flex: 1;
  resize: none;
  background: #111;
  color: #0ff;
  border: 2px solid #0ff;
  border-radius: 10px;
  padding: 10px;
  font-size: 14px;
  outline: none;
  box-shadow: 0 0 10px #0ff inset;
}

button {
  background: #0ff;
  border: none;
  color: #000;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  box-shadow: 0 0 15px #0ff;
  transition: 0.3s;
}

button:hover {
  background: #00e6e6;
  box-shadow: 0 0 25px #00e6e6;
}

.logo {
  text-align: center;
  font-size: 24px;
  color: #0ff;
  margin-bottom: 10px;
  text-shadow: 0 0 10px #0ff;
}

  </style>
</head>
<body>
  <div class="chat-container">
    <div class="logo"><i class='bx bx-bot'></i> CoderX AI</div>
    <div class="chat-box" id="chat-box"></div>
    <div class="input-container">
      <textarea id="user-message" placeholder="Ask anything..."></textarea>
      <button id="send-btn"><i class='bx bx-send'></i></button>
    </div>
  </div>  <script>
    document.getElementById('send-btn').addEventListener('click', () => {
      const msg = document.getElementById('user-message').value.trim();
      if (msg) {
        addMessage('user-message', msg);
        document.getElementById('user-message').value = '';
        sendMessage(msg);
      }
    });

    function addMessage(type, content) {
      const msg = document.createElement('div');
      msg.className = 'message ' + type;
      msg.innerHTML = content;
      const box = document.getElementById('chat-box');
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage(message) {
      fetch('/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'user_message=' + encodeURIComponent(message)
      })
      .then(res => res.text())
      .then(reply => addMessage('ai-response', reply))
      .catch(err => addMessage('ai-response', "<i>Error fetching response</i>"));
    }
  </script></body>
</html>
