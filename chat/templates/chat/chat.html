<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat with CoderX AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .chat-container {
      width: 100%;
      max-width: 450px;
      height: 95vh;
      display: flex;
      flex-direction: column;
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid #444;
      border-radius: 20px;
      box-shadow: 0 0 20px #0ff;
      backdrop-filter: blur(10px);
      padding: 20px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 15px;
      background: rgba(20, 20, 20, 0.9);
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
      margin-bottom: 15px;
      scroll-behavior: smooth;
    }

    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeInUp 0.4s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      background: #00c853;
      color: white;
      align-self: flex-end;
    }

    .ai-response {
      background: #2962ff;
      color: white;
      align-self: flex-start;
    }

    .input-container {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      resize: none;
      font-size: 14px;
      backdrop-filter: blur(5px);
    }

    button {
      background: #00bcd4;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 0 15px #00e5ff, inset 0 0 5px #00bcd4;
    }

    button:hover {
      background: #00acc1;
      box-shadow: 0 0 20px #00e5ff, inset 0 0 10px #00bcd4;
    }

    @media (max-width: 480px) {
      .chat-container {
        width: 95%;
        height: 100vh;
        border-radius: 0;
      }

      textarea, button {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <!-- Messages appear here -->
    </div>
    <div class="input-container">
      <textarea id="user-message" placeholder="Type your message..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');
    const userInput = document.getElementById('user-message');

    sendBtn.addEventListener('click', () => {
      const message = userInput.value.trim();
      if (message !== '') {
        addMessage('user-message', message);
        userInput.value = '';
        sendMessageToServer(message);
      }
    });

    function addMessage(type, text) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessageToServer(msg) {
      fetch('/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'user_message=' + encodeURIComponent(msg)
      })
      .then(res => res.text())
      .then(reply => {
        addMessage('ai-response', reply);
      })
      .catch(err => {
        console.error(err);
        addMessage('ai-response', "Something went wrong!");
      });
    }
  </script>
</body>
</html>
