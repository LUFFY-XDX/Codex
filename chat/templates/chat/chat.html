<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoderX AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #00f5ff;
            --primary-dark: #00d4ff;
            --secondary: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            
            --text-primary: #ffffff;
            --text-secondary: #b8c5d1;
            --text-muted: #6b7280;
            
            --border: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(0, 245, 255, 0.3);
            
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            
            --radius: 12px;
            --radius-lg: 16px;
            
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Simple background gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Main Chat Container */
        .chat-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            padding: 20px 30px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--bg-primary);
            box-shadow: var(--shadow);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logo-title {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 16px;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary);
            border-color: var(--border-focus);
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Messages */
        .message {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            max-width: 80%;
            animation: slideIn 0.3s ease-out;
        }

        .message.user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai-response {
            align-self: flex-start;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .user-message .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-primary);
        }

        .ai-response .message-avatar {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: var(--text-primary);
        }

        .message-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message-bubble {
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .user-message .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-primary);
            border-top-right-radius: 6px;
        }

        .ai-response .message-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-top-left-radius: 6px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .user-message .message-time {
            text-align: right;
        }

        .ai-response .message-time {
            text-align: left;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition);
        }

        .typing-indicator.active {
            opacity: 1;
            transform: translateY(0);
        }

        .typing-dots {
            display: flex;
            gap: 6px;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            border-top-left-radius: 6px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* Input Area */
        .chat-input {
            padding: 20px 30px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 16px;
            max-width: 100%;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            min-height: 50px;
            max-height: 120px;
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            line-height: 1.4;
            resize: none;
            outline: none;
            transition: var(--transition);
        }

        .message-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.1);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Welcome Message */
        .welcome-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            text-align: center;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--bg-primary);
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
        }

        .welcome-title {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
            max-width: 500px;
        }

        .welcome-suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            justify-content: center;
            max-width: 600px;
            width: 100%;
        }

        .suggestion-btn {
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .suggestion-btn i {
            font-size: 16px;
            color: var(--primary);
        }

        .suggestion-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary);
            border-color: var(--border-focus);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .chat-header {
                padding: 16px 20px;
            }
            
            .logo-section {
                gap: 12px;
            }
            
            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .logo-title {
                font-size: 18px;
            }
            
            .header-actions {
                gap: 8px;
            }
            
            .header-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            
            .chat-messages {
                padding: 20px;
                gap: 16px;
            }
            
            .message {
                max-width: 90%;
                gap: 12px;
            }
            
            .message-avatar {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            
            .message-bubble {
                padding: 12px 16px;
                font-size: 13px;
            }
            
            .chat-input {
                padding: 16px 20px;
            }
            
            .input-container {
                gap: 12px;
            }
            
            .send-btn {
                width: 46px;
                height: 46px;
                font-size: 16px;
            }
            
            .welcome-message {
                padding: 40px 20px;
            }
            
            .welcome-icon {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }
            
            .welcome-title {
                font-size: 24px;
            }
            
            .welcome-subtitle {
                font-size: 14px;
            }
            
            .welcome-suggestions {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .status-indicator {
                display: none;
            }
            
            .message-input {
                min-height: 46px;
            }
            
            .send-btn {
                width: 42px;
                height: 42px;
                font-size: 14px;
            }
            
            .welcome-message {
                padding: 30px 16px;
            }
            
            .welcome-icon {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }
            
            .welcome-title {
                font-size: 20px;
            }
            
            .welcome-subtitle {
                font-size: 13px;
            }
        }

        /* Code styling */
        .message-bubble pre {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: var(--radius);
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            margin: 8px 0;
        }

        .message-bubble code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Main Chat Container -->
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class='bx bx-bot'></i>
                </div>
                <div class="logo-text">
                    <div class="logo-title">CoderX AI</div>
                    <div class="logo-subtitle">Smart Chat</div>
                </div>
            </div>
            <div class="header-actions">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>Online</span>
                </div>
                <div class="header-btn" onclick="clearChat()">
                    <i class='bx bx-trash'></i>
                </div>
                <div class="header-btn" onclick="toggleSettings()">
                    <i class='bx bx-cog'></i>
                </div>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chat-box">
            <!-- Welcome Message -->
            <div class="welcome-message" id="welcome-message">
                <div class="welcome-icon">
                    <i class='bx bx-bot'></i>
                </div>
                <div class="welcome-title">Welcome to CoderX AI</div>
                <div class="welcome-subtitle">
                    Your intelligent coding assistant. Ask me anything about programming, development, or technology.
                </div>
                <div class="welcome-suggestions">
                    <div class="suggestion-btn" onclick="sendSuggestion('Help me debug this code')">
                        <i class='bx bx-bug'></i>
                        <span>Debug Code</span>
                    </div>
                    <div class="suggestion-btn" onclick="sendSuggestion('Explain React concepts')">
                        <i class='bx bx-book'></i>
                        <span>Learn Concepts</span>
                    </div>
                    <div class="suggestion-btn" onclick="sendSuggestion('Write a REST API')">
                        <i class='bx bx-code-alt'></i>
                        <span>Generate Code</span>
                    </div>
                    <div class="suggestion-btn" onclick="sendSuggestion('Best practices for coding')">
                        <i class='bx bx-star'></i>
                        <span>Best Practices</span>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator">
                <div class="message-avatar">
                    <i class='bx bx-bot'></i>
                </div>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="user-message" 
                        class="message-input" 
                        placeholder="Type your message... (Shift + Enter for new line)"
                        rows="1"
                    ></textarea>
                </div>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <i class='bx bx-send'></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-message');
        const sendButton = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const welcomeMessage = document.getElementById('welcome-message');

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            
            // Enable/disable send button
            sendButton.disabled = !this.value.trim();
        });

        // Handle Enter key
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Send message function
        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Hide welcome message
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }

            // Add user message
            addMessage('user-message', message);
            
            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            sendButton.disabled = true;

            // Show typing indicator
            showTypingIndicator();

            // Send to Django backend
            fetch('/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: 'user_message=' + encodeURIComponent(message)
            })
            .then(response => response.text())
            .then(reply => {
                hideTypingIndicator();
                addMessage('ai-response', reply);
            })
            .catch(error => {
                hideTypingIndicator();
                addMessage('ai-response', '<i class="bx bx-error-circle"></i> Sorry, I encountered an error. Please try again.');
                console.error('Error:', error);
            });
        }

        // Add message to chat
        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div class="message-avatar">
                    ${type === 'user-message' ? '<i class="bx bx-user"></i>' : '<i class="bx bx-bot"></i>'}
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        ${content}
                    </div>
                    <div class="message-time">${currentTime}</div>
                </div>
            `;
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            typingIndicator.classList.add('active');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            typingIndicator.classList.remove('active');
        }

        // Send suggestion
        function sendSuggestion(suggestion) {
            userInput.value = suggestion;
            sendMessage();
        }

        // Clear chat
        function clearChat() {
            if (confirm('Are you sure you want to clear all messages?')) {
                chatBox.innerHTML = `
                    <div class="welcome-message" id="welcome-message">
                        <div class="welcome-icon">
                            <i class='bx bx-bot'></i>
                        </div>
                        <div class="welcome-title">Welcome to CoderX AI</div>
                        <div class="welcome-subtitle">
                            Your intelligent coding assistant. Ask me anything about programming, development, or technology.
                        </div>
                        <div class="welcome-suggestions">
                            <div class="suggestion-btn" onclick="sendSuggestion('Help me debug this code')">
                                <i class='bx bx-bug'></i>
                                <span>Debug Code</span>
                            </div>
                            <div class="suggestion-btn" onclick="sendSuggestion('Explain React concepts')">
                                <i class='bx bx-book'></i>
                                <span>Learn Concepts</span>
                            </div>
                            <div class="suggestion-btn" onclick="sendSuggestion('Write a REST API')">
                                <i class='bx bx-code-alt'></i>
                                <span>Generate Code</span>
                            </div>
                            <div class="suggestion-btn" onclick="sendSuggestion('Best practices for coding')">
                                <i class='bx bx-star'></i>
                                <span>Best Practices</span>
                            </div>
                        </div>
                    </div>
                    <div class="typing-indicator" id="typing-indicator">
                        <div class="message-avatar">
                            <i class='bx bx-bot'></i>
                        </div>
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                `;
            }
        }

        // Toggle settings
        function toggleSettings() {
            alert('Settings panel coming soon!');
        }

        // Get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            userInput.focus();
        });
    </script>
</body>
</html>
